[package]
name = "bot-rs"
version = "0.1.0"
edition = "2024"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Music sources, accounts and the Telegram cache live in MHub; this crate is
# its gateway contract and client, pinned to the MHub commit it was built with.
music-gateway = { git = "https://github.com/jizizr/mhub", branch = "main", features = ["client"] }
tokio = "1.0"
reqwest = { version = "0.13", features = ["rustls", "json", "blocking", "cookies", "query", "form"] }
serde = { version = "1", features = ["derive"] }
regex = "1.10"
clap = { version = "4.5", features = ["derive"] }
thiserror = "2"
# Pre-release: pin exactly and read the changelog before moving.
telers = { version = "=1.0.0-beta.10", default-features = false, features = ["rustls-tls", "serde", "webhooks-axum"] }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
log = "0.4"
# telers reports through tracing; with no subscriber this forwards its events
# to `log`, so they reach the same output as the bot's own.
tracing = { version = "0.1", features = ["log"] }
pretty_env_logger = "0.5"
serde_json = { version = "1.0", features = ["preserve_order"] }
fast_qr = { version = "0.14", features = ["image"] }
mysql_async = "0.37"
async-trait = "0.1"
scraper = "0.29"
cached = { version = "4", features = ["async"] }
chrono = { version = "0.4" }
dashmap = "6"
image = "0.25"
jieba-rs = "0.11"
cron = "0.17"
tokio-native-tls = "0.3"
x509-parser = "0.18"
toml = "1"
sled = "0.34"
urlencoding = "2.1"
reqwest-middleware = { version = "0.5", features = ["json", "query", "form"] }
reqwest-retry = "0.9"
redis = { version = "1", features = ["tokio-comp"] }
ping-server-rs = { git = "https://github.com/jizizr/ping-server-rs" }
futures = "0.3"
lingua = { version = "1", default-features = false, features = [
    "chinese",
    "english",
] }
wcloud = { git = "https://github.com/jizizr/wcloud" }
rand = "0.10"
url = "2.5"
mongodb = { version = "3.10", default-features = false, features = ["compat-3-3-0", "bson-3", "rustls-tls", "dns-resolver"] }
bson = { version = "3", features = ["chrono-0_4", "serde"] }
serde_repr = "0.1"
anstyle = "1.0"
aes = "0.9"
base64 = "0.23"
cbc = { version = "0.2", features = ["alloc"] }
indexmap = { version = "2", features = ["serde"] }
md5 = "0.8"
prost = "0.14"
uuid = { version = "1", features = ["v4"] }
charts-rs = { version = "2", features = ["image-encoder"] }
clap-i18n-richformatter = { git = "https://github.com/jizizr/clap-i18n-richformatter", features = [
    "derive",
] }
ferrous-opencc = "0.4"
skia-safe = { version = "0.157", features = ["textlayout"] }
[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
panic = "abort"

